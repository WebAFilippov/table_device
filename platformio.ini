; Стол с регулировкой высоты — ESP32-S3 DevKitC-1 (N16R8, 8 МБ OPI PSRAM)
;
; Окружения:
;   test01 — дисплей ST7796 + тач FT6336U
;   test02 — энкодер (PCNT)
;   test03 — драйвер BTS7960 + мотор
;   firmware — боевая прошивка (src/main.cpp)

[platformio]
default_envs = test01

[env]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
monitor_speed = 115200

[env:test01]
extends = env
build_src_filter = +<test01_display_touch/>
lib_deps =
  bodmer/TFT_eSPI@^2.5.0
build_flags =
  ; FIX ядро 3.3.x + S3: FSPI=0 и REG_SPI_BASE(i<2)=0 -> TFT_eSPI писал в адрес 0x10 (паника).
  ; USE_FSPI_PORT задаёт SPI_PORT=2 -> GPSPI2 (0x60024000), периферия пинов 10-13.
  ; ВАЖНО: флаг должен быть в каждом env, где собирается TFT_eSPI (extends НЕ объединяет build_flags).
  -DUSE_FSPI_PORT
  ; конфиг TFT_eSPI через флаги (User_Setup.h не трогаем)
  -DUSER_SETUP_LOADED=1
  -DST7796_DRIVER
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MISO=13
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=4
  -DTFT_RST=5
  -DSPI_FREQUENCY=27000000
  -DSPI_READ_FREQUENCY=20000000
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_FONT6
  -DLOAD_FONT7
  -DLOAD_FONT8
  -DLOAD_GFXFF

[env:test02]
extends = env
build_src_filter = +<test02_encoder/>
lib_deps =
  madhephaestus/ESP32Encoder

[env:test03]
extends = env
build_src_filter = +<test03_motor/>
lib_deps =
  madhephaestus/ESP32Encoder

[env:firmware]
extends = env
build_src_filter = +<firmware/>
lib_deps =
  madhephaestus/ESP32Encoder
  bodmer/TFT_eSPI@^2.5.0
  lvgl/lvgl@~8.3.11
build_flags =
  ; TFT_eSPI: те же флаги, что в test01 (extends НЕ объединяет build_flags!)
  -DUSE_FSPI_PORT
  -DUSER_SETUP_LOADED=1
  -DST7796_DRIVER
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MISO=13
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=4
  -DTFT_RST=5
  -DSPI_FREQUENCY=27000000
  -DSPI_READ_FREQUENCY=20000000
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_FONT6
  -DLOAD_FONT7
  -DLOAD_FONT8
  -DLOAD_GFXFF
  ; LVGL: конфиг берётся из include/lv_conf.h
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
